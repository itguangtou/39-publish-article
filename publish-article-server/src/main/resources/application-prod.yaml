spring:
  application:
    name: publish-article-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/publish_article?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: publish_article
    password: 1234
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

storage:
  base-dir: data
  public-prefix: /data/
  max-width: 1080
  webp-quality: 0.8

jwt:
  secret: prod-jwt-secret-key-at-least-256-bits-long-change-before-deploy
  expiration: 86400000
